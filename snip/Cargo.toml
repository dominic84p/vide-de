[package]
name = "snip-and-sketchy"
version = "0.1.0"
edition = "2024"
description = "Snip & Sketchy: mark up screenshots. Like Snip & Sketch, but sketchier."

[dependencies]
vide-config = { path = "../config" }
vide-fonts = { path = "../fonts" }
# glow, not the default wgpu: a Vulkan device costs ~200 MiB of VRAM per app on NVIDIA.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "x11", "glow"] }
egui_extras = { version = "0.37", features = ["image", "svg", "file"] }
png = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
