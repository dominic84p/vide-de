[package]
name = "vide-about"
version = "0.1.0"
edition = "2024"
description = "About VIDE-DE: system info from fastfetch, in a proper window"

[dependencies]
vide-fonts = { path = "../fonts" }
# glow, not the default wgpu: a Vulkan device costs ~200 MiB of VRAM per app on NVIDIA.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "x11", "glow"] }
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
