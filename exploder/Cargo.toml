[package]
name = "file-exploder"
version = "0.1.0"
edition = "2024"
description = "File Exploder: VIDE-DE's file manager. Like File Explorer, but it might go off."

[dependencies]
vide-config = { path = "../config" }
vide-fonts = { path = "../fonts" }
# glow, not the default wgpu: a Vulkan device costs ~200 MiB of VRAM per app on NVIDIA.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "x11", "glow"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image", "svg", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
